services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - TZ=America/Bogota
      - DATABASE_URL=postgresql://syncbank:syncbank@postgres:5432/syncbank
    env_file:
      - path: .env
        required: false
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: syncbank
      POSTGRES_USER: syncbank
      POSTGRES_PASSWORD: syncbank
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncbank -d syncbank"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
